<section class="admin-page" aria-labelledby="admin-title">
  <header class="page-head">
    <div class="page-head-inner">
      <a class="back-link" href="/">
        <span aria-hidden="true">←</span> Torna alla home
      </a>
      <div class="page-title">
        <h1 id="admin-title">Pannello amministratore.</h1>
        <p class="page-lead">
          Ciao, {{ user()?.displayName ?? 'Amministratore' }}. Da qui segui le aule del giorno, gli
          avvisi aperti, i report di utilizzo e il catalogo degli spazi.
        </p>
      </div>
    </div>
  </header>

  <div class="page-body">
    <ul class="admin-links">
      <li><a class="text-link" href="/admin/dashboard">Dashboard aule</a></li>
      <li><a class="text-link" href="/admin/alerts">Avvisi ed eccezioni</a></li>
      <li><a class="text-link" href="/admin/report">Report di utilizzo</a></li>
      <li><a class="text-link" href="/admin/spaces">Gestione spazi</a></li>
    </ul>

    <button mat-button class="text-action" type="button" (click)="logout()">Esci</button>
  </div>
</section>
