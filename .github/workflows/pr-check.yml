name: Controllo PR

# Controllo fisso, senza LLM e senza segreti: docs/agents/pr-checker.md
on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

# Sola lettura: serve solo a scaricare lo script
permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: Controllo PR
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      # Titolo e corpo passano come variabili d'ambiente, così il testo della PR non può diventare un comando
      - name: Titolo, issue collegata e verifiche
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: bash .github/scripts/check-pr.sh
