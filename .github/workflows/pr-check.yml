name: Controllo PR

# Controllo fisso, senza LLM e senza segreti: docs/agents/pr-checker.md
on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

# Sola lettura: serve solo a scaricare lo script e la storia dei commit della PR
permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: Controllo PR
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      # Titolo, corpo, branch e commit passano come variabili d'ambiente, così il testo della PR non può diventare un comando
      - name: Messaggi di commit della PR
        id: commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # Delimitatore casuale: un messaggio di commit uguale al delimitatore non può chiudere l'output in anticipo
        run: |
          delimiter="COMMITS_$(openssl rand -hex 16)"
          {
            echo "list<<$delimiter"
            git log --format=%s "$BASE_SHA..$HEAD_SHA"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Titolo, issue collegata, nomi e verifiche
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_BRANCH: ${{ github.head_ref }}
          PR_COMMITS: ${{ steps.commits.outputs.list }}
        run: bash .github/scripts/check-pr.sh
